name: CI

# Every guarantee this library makes -- the read-back checks, the encoded path
# segments, the credential boundary -- rests on the suite being run. Locally
# that depends on someone remembering (audit F8).

on:
  push:
  pull_request:

# Read-only by default. The workflow builds and tests; it publishes nothing,
# comments nowhere, and pushes no tag, so the token it runs under should be
# able to do none of those either (audit OPS-2).
permissions:
  contents: read

# One run per branch. A second push while the first is still going makes the
# first answer stale, and a stale green is worse than no answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The suite takes about a minute. Fifteen is room for a slow runner and a
    # ceiling on a hung job, which otherwise blocks the queue for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The package promises >=3.11. A promise nobody checks is a guess.
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # One Windows leg. The library is developed on Windows and used
          # there, but CI only ever ran on Linux -- so the cp1252 default
          # encoding, the CRLF line endings and the backslash paths, the whole
          # class of bug that only shows up there, never ran here (audit
          # OPS-2). One version is enough to catch it; four would only pay
          # four times for the same answer.
          - os: windows-latest
            python: "3.13"

    steps:
      # Actions pinned by commit, not by tag: a tag can be moved, and then
      # what runs here is whatever someone points it at (audit OPS-2). The
      # comment names the version the SHA stood for when it was pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Pinned for the same reason as the actions: an unpinned installer is a
      # dependency nobody declared.
      - name: Install uv
        run: pip install uv==0.12.10

      # --locked: install exactly what uv.lock pins AND assert the lock still
      # matches pyproject.toml. --frozen stood here and only did the first
      # half: a pyproject change without a lock update passed silently, which
      # is precisely what this step promised to catch (audit OPS-1).
      # --python: without it uv picks its own interpreter and the matrix would
      # test the same version four times.
      - name: Install dependencies
        run: uv sync --group dev --locked --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      # Ruff reads style, mypy reads types -- different questions. It found a
      # json.loads on a value that could be None and an int() that relied on
      # catching TypeError; both were correct by accident of a guard written
      # so the checker could not see it (audit F5).
      - name: Type check
        run: uv run mypy

      # --skip-editable leaves out the project itself: it is installed editable
      # and is not on PyPI, which pip-audit reports as an error rather than a
      # clean run. Everything it depends on is still audited -- verified by
      # pinning a known-vulnerable jinja2, which produced 5 findings.
      - name: Audit dependencies
        run: uv run --with pip-audit==2.10.1 pip-audit --skip-editable

      # Offline only. The live and write suites need credentials and write into
      # a real repository -- they are deselected by addopts in pyproject.toml
      # and stay a deliberate, local act.
      #
      # The failure summary is repeated as an error annotation because the run
      # log needs a sign-in to read, while annotations are public. The first
      # Windows run failed on 2026-09-08 and left an exit code and nothing
      # else; a red build nobody can read is barely better than no build.
      - name: Tests
        shell: bash
        run: |
          set +e
          uv run pytest -q --tb=short 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            printf '::error title=pytest::%s\n' \
              "$(tail -n 40 pytest.log | tr -d '\r' | sed 's/%/%25/g' \
                 | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$rc"

  coverage:
    # The suite runs in `test` on five legs; this job runs it once more to
    # measure it. Until then it was measured only locally, so only when
    # someone remembered -- and statement coverage alone read 98 % while whole
    # promised error paths never ran: a line is reached, the branch that skips
    # it is not (audit TST-20-2). `branch = true` stands in pyproject.toml, so
    # that a local run measures the same.
    #
    # 97 against 97.84 measured on 2026-09-20: a floor that catches a slide,
    # not a ratchet that fails on rounding. It stands here and not in
    # pyproject.toml, because a partial run naturally lies below it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.12.10
      - name: Install dependencies
        run: uv sync --group dev --locked --python 3.13
      - name: Measure
        run: uv run pytest -q --cov --cov-report=term-missing:skip-covered --cov-fail-under=97

  # --- 5.4 of the external review of 2026-09-09 -----------------------------
  #
  # The suite checks the source. It does not check whether that becomes a
  # package that can be installed, nor whether the checked-in generated layer
  # is still the one that falls out of the spec. Both passed in the review --
  # as a gate, the second would have shown F15 earlier.

  package:
    # A wheel that cannot be installed or imported is otherwise noticed only
    # by its first user. One Python version is enough: the question is "does
    # this become a package", not "does the code run".
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.12.10

      - name: Build
        run: uv build

      # In an environment of its own, without the project directory: otherwise
      # the next step imports the source beside it instead of the wheel and
      # answers another question.
      - name: Install the wheel
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl

      # Every module, not only the package: the generated layer is 1131
      # files, and a broken import inside it does not show when the package
      # is imported.
      - name: Import every module
        run: |
          cd /tmp
          /tmp/wheeltest/bin/python - <<'PY'
          import importlib, pkgutil, sys
          import edusharing
          errors = []
          for module in pkgutil.walk_packages(edusharing.__path__, "edusharing."):
              try:
                  importlib.import_module(module.name)
              except Exception as exc:  # noqa: BLE001 -- every reason counts
                  errors.append(f"{module.name}: {type(exc).__name__}: {exc}")
          print(f"{len(sys.modules)} modules loaded, {len(errors)} errors")
          for error in errors[:20]:
              print("   ", error)
          sys.exit(1 if errors else 0)
          PY

  generate:
    # Regenerates the layer and demands a clean diff. Without this gate
    # "regenerable" is a claim: the checked-in files may have been changed by
    # hand, or the way of generating may have changed without anyone
    # regenerating.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.12.10
      - name: Install dependencies
        run: uv sync --group dev --locked --python 3.13

      - name: Regenerate
        run: uv run python scripts/generate_client.py

      # ``--exit-code`` reads the diff as a result, not as text. The name of
      # the first differing file stands in the output above it.
      - name: The checked-in layer is the generated one
        run: |
          git --no-pager diff --stat -- src/edusharing/_generated
          git diff --exit-code -- src/edusharing/_generated

  # --- Section 7 of the second review of 2026-09-09 -------------------------

  minimum:
    # `test` installs `uv.lock` -- the *upper* edge: measured on 2026-09-09,
    # attrs 26.1.0 and httpx 0.28.1. The floor `pyproject.toml` promises
    # (`httpx>=0.27`, `attrs>=23.2`, `requires-python >=3.11`) ran in no job.
    # A promise nobody checks is a guess.
    #
    # Today this job is green -- the floor holds, measured 2221 passed. Its
    # value lies ahead: the first call that needs a newer httpx turns it red
    # while the matrix stays green. That it can do so at all was reproduced:
    # with `attrs==22.1.0` even the collection breaks off
    # (`field() got an unexpected keyword argument 'alias'`).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv==0.12.10

      # The pins come from the declaration, not from this file. Were they
      # written here, this job would go on checking the old version after a
      # raised `>=` -- and the new one, the one actually promised, not at all.
      #
      # A form the pattern does not match (say `httpx>=0.27,<1.0`) stops the
      # job rather than skipping the dependency silently.
      - name: Read the declared floors
        run: |
          python - > "$RUNNER_TEMP/floors.txt" <<'PY'
          import pathlib
          import re
          import tomllib

          deps = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text("utf-8")
          )["project"]["dependencies"]
          pins = []
          for dep in deps:
              match = re.fullmatch(
                  r"([A-Za-z0-9._-]+)\s*>=\s*([0-9][0-9A-Za-z.*+!-]*)", dep.strip())
              if not match:
                  raise SystemExit(
                      f"{dep!r} is not a plain >= floor. This job knows only "
                      "those; better to stop loudly than to leave the "
                      "dependency unchecked.")
              pins.append(f"{match.group(1)}=={match.group(2)}")
          print(" ".join(pins))
          PY
          cat "$RUNNER_TEMP/floors.txt"

      # The environment lies outside the working directory: several tests walk
      # the repository with `rglob`, and a venv beside it would simply be more
      # repository to them.
      #
      # `--no-deps` for the project, otherwise the resolver resolves `>=`
      # upwards and installs exactly what this job does not mean. pytest is
      # not pinned: the question is the runtime dependencies, not the tool.
      - name: Install at the declared floor
        run: |
          python -m venv "$RUNNER_TEMP/floor"
          uv pip install --python "$RUNNER_TEMP/floor/bin/python" --no-deps -e .
          uv pip install --python "$RUNNER_TEMP/floor/bin/python" \
            $(cat "$RUNNER_TEMP/floors.txt") "pytest>=8.0" "pytest-asyncio>=0.24"
          "$RUNNER_TEMP/floor/bin/python" -c \
            "import attrs, httpx; print('httpx', httpx.__version__, '| attrs', attrs.__version__)"

      - name: Tests
        run: |
          "$RUNNER_TEMP/floor/bin/python" -m pytest -q --tb=short
