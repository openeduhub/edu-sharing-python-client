version: 2

# `pip-audit` runs on every push and says when something is already known to
# be broken. That a newer version exists, nobody said until now -- and the
# actions are pinned to commits, so nothing there moves by itself at all
# (audit OPS-20-1).
#
# Monthly: two runtime dependencies and a handful of pinned actions need no
# weekly pull request.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    # init and analyze of the CodeQL action must run the same version. As two
    # pull requests, each one failed on its own (measured 2026-11-01: "Loaded a
    # configuration file for version '4.38.1', but running version '4.39.1'")
    # and neither could be merged first. One group, one pull request.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Covers `pyproject.toml` and `uv.lock` together. That is the point: CI
  # installs with `--locked`, so a bump without a new lockfile would not be
  # installed at all. Should Dependabot not know this name, "pip" reads
  # `pyproject.toml` alone, and the lockfile then needs a `uv lock` by
  # hand.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
