[project]
name = "edu-sharing-python-client"
version = "0.3.5"
description = "Python client for edu-sharing repositories and the b-api -- repository-agnostic, async-first"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jan Schachtschabel" }]
keywords = ["edu-sharing", "openeduhub", "wirlernenonline", "oer", "metadata", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

dependencies = [
    "httpx>=0.27",
    # The generated layer's only runtime dependency. openapi-python-client also
    # declares python-dateutil and typing-extensions; measured 2026-09-03,
    # neither is imported anywhere under src/ -- the generated code parses
    # dates with datetime.fromisoformat. tests/test_dependencies.py keeps it
    # that way (audit DEP-1).
    "attrs>=23.2",
]

[project.urls]
# The published home. The development repository carries the same `main` and
# the older tags; what a user installs, reads and reports to is this one.
Repository = "https://github.com/openeduhub/edu-sharing-python-client"
Issues = "https://github.com/openeduhub/edu-sharing-python-client/issues"
Changelog = "https://github.com/openeduhub/edu-sharing-python-client/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edusharing"]

# The source distribution names what it carries. Without this section hatchling
# takes everything under version control -- measured 2026-09-08: 1318 files and
# 1.2 MB, among them `.claude/`, `.github/`, `uv.lock` and the 1.3 MB
# specification (audit OPS-5).
#
# A positive list, not an exclude list. An exclude list ages with every new
# directory: whatever is added ships until someone remembers it. This one is
# the definition -- it cannot become incomplete, only too small, and that
# shows on the first install.
#
# `.env` is not here, and with a positive list that no longer depends on
# hatchling reading `.gitignore` -- which is what kept it out until now.
#
# What is deliberately left out:
#   tests/    checks the *repository*, not the package -- the documents,
#             `uv.lock`, `.github/`. Without those its guards do not go red,
#             they go quiet: `rglob` over a directory that is not there returns
#             nothing. Shipping them would promise a check that is not
#             happening.
#   openapi/  1.3 MB, needed only to regenerate. The hash in
#             `_generated/GENERATED.md` is what ties the generated layer to it;
#             whoever verifies that clones the repository.
#   docs/     read on GitHub, and linked from the README as such.
#   .github/, .claude/, scripts/, uv.lock  the development environment.
[tool.hatch.build.targets.sdist]
include = [
    "src/edusharing",
    "pyproject.toml",
    "LICENSE",
    "README.md",
    "README.de.md",
    "CHANGELOG.md",
    "SECURITY.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Network access is never the default: `pytest` runs offline and
# deterministically. Ask for live tests explicitly with `pytest -m live`.
addopts = "-m 'not live and not write'"
markers = [
    "live: talks to a real instance (needs EDU_SHARING_URL)",
    "write: WRITES into a repository (needs credentials and a throwaway folder)",
]

[tool.ruff]
line-length = 100
src = ["src"]
# The generated layer is never touched by hand.
extend-exclude = ["src/edusharing/_generated"]

[tool.ruff.lint]
# The blank-line rules E301-E306 are preview rules in ruff 0.16, so "E" alone
# never selected them, and four slips in ``src/`` went unnoticed (audit
# 2026-09-23). ``explicit-preview-rules`` keeps preview to exactly the codes
# named below: measured, it adds no finding to any other selected rule. A ruff
# update may still move a preview rule -- then this is where to look.
preview = true
explicit-preview-rules = true
select = [
    "E", "W",    # pycodestyle
    "E301", "E302", "E303", "E304", "E305", "E306",  # blank lines (preview)
    "F",         # pyflakes
    "I",         # import order
    "UP",        # outdated spellings
    "B",         # common traps (bugbear)
    "PIE",       # redundant constructs
    "PYI",       # type annotations
    "RUF",       # ruff's own rules
    "C90",       # cyclomatic complexity
]
ignore = [
    # __all__ is grouped and commented by topic in this library (entry point /
    # credentials / errors), not sorted alphabetically. The grouping tells a
    # reader more than the ordering would.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# The test doubles are fake HTTP servers: one flat dispatch on method and path,
# read top to bottom. Cutting that into thirty functions to satisfy a
# complexity limit would hide the shape instead of showing it. The limit is
# about what a maintainer has to reason about in the library.
"tests/*" = ["C901"]

[tool.ruff.lint.mccabe]
# _text_score sat at 15 and read as one wall of scoring rules (audit F6). Ten
# is the usual line; the whole hand-written layer is under it, so keeping it
# there costs nothing and says when a function has grown a second job.
max-complexity = 10

[dependency-groups]
# One place for dev dependencies (PEP 735). They were split across
# optional-dependencies and this group before, so `pip install -e .[dev]` and
# `uv sync` installed different sets (audit F9).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "openapi-python-client>=0.29",
]

[tool.mypy]
# The settings live here so CI and a local run check the same thing.
files = ["src/edusharing"]
# Machine output: it is regenerated, never edited, and carries its own style.
exclude = ["src/edusharing/_generated/"]
# httpx ships types; the generated client's helpers do not.
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/edusharing"]
# Statements alone said 98 % while whole documented failure paths had never
# run: a line is reached, the branch that skips it is not (audit TST-20-2).
branch = true
# The generated layer is never hand-written and never hand-tested; including it
# would drown the real figure (54,570 statements against roughly 1,200).
omit = ["*/_generated/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
