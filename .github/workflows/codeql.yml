name: CodeQL

# The suite proves what this library does. This job asks something else:
# whether the way there contains a known bad pattern -- and it finds one in
# code nobody reads any more, too. `pip-audit` covers the dependencies; the
# library's own source was covered by nothing until now (audit OPS-20-1).
#
# The generated layer stays out: 1,131 machine-written files would dominate
# every list of findings, and nothing there is changed by hand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A new query also finds yesterday's code, so a weekly run is not the same
    # as one on every push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The only way findings reach the Security tab.
      security-events: write
      actions: read
    steps:
      # Pinned to the commit as in ci.yml, not to the label: a tag can be
      # moved, and then what runs here is whatever someone points it at. The
      # comment names the version the SHA stood for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4
        with:
          languages: python
          config: |
            paths-ignore:
              - src/edusharing/_generated

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4
